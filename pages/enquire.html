<head>

</head>
<body class = "Enquire-body">
    <div class = "Enquires-start-section">
        <div class = "Enquires-header-image">
    <header>
        <nav>
            <div class="logo-group">
        <img src="../assets/images/Screenshot 2026-08-13 140642.png" alt="Crumb&Co logo" class="logo-image">
        <span class = "bakery-name">Crumb&Co.</span>

         </div>

    <main> <!--enquire page main -->
      <div class = "Enquires-header-content">
        <h1>Enquiry Form</h1>
        <p>
            Please fill out the form below to submit your enquiry. We will get back to you as soon as possible.
        </p>
         </div>
    </main>
    </div>
</div>
<br><br>

        <div class = "enquiry-form">
                <form action="mailto:info@crumbandco.com" method="post" enctype="text/plain" id="enquiry-form" novalidate>
        <div class="personal-details">
            <h3>Personal Details</h3>
            <div class="field">
                <label for="name">Name:</label>
                <input id="name" name="name" type="text" placeholder="Enter your name" required minlength="2" maxlength="60" autocomplete="name" data-rule="name">
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="email">Email Address:</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required autocomplete="email" data-rule="email">
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="phone">Customer Phone Number:</label>
                <input id="phone" name="phone" type="tel" placeholder="e.g. 021 123 4567" required autocomplete="tel" data-rule="phone">
                <span class="error-msg" aria-live="polite"></span>
            </div>
        </div>
        <div class="cake-details">
            <h3>Cake Details</h3>
            <div class="field">
                <label for="cake-type">Cake Type:</label>
                <select id="cake-type" name="cake-type" required data-rule=""><option value="birthday">Birthday Cake</option><option value="wedding">Wedding Cake</option><option value="custom">Custom Cake</option><option value="cupcake">Cup Cake</option></select>
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="cake-flavour">Cake Flavour:</label>
                <input id="cake-flavour" name="cake-flavour" type="text" placeholder="Enter the cake flavour" required minlength="2" maxlength="50" data-rule="flavour">
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="cake-size">Cake Size:</label>
                <select id="cake-size" name="cake-size" required data-rule=""><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select>
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="number-of-cakes">Number of Cakes:</label>
                <input id="number-of-cakes" name="number-of-cakes" type="number" min="1" max="50" step="1" placeholder="Enter the number of cakes" required data-rule="quantity">
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="occasion">Occasion:</label>
                <select id="occasion" name="occasion" required data-rule=""><option value="birthday">Birthday</option><option value="wedding">Wedding</option><option value="anniversary">Anniversary</option><option value="baby-shower">Baby Shower</option><option value="graduation">Graduation</option><option value="other">Other</option></select>
                <span class="error-msg" aria-live="polite"></span>
            </div>
        </div>
        <div class="pickup-delivery-time">
            <h3>Timing</h3>
            <div class="field">
                <label for="pickup-date">Pickup/Delivery Date:</label>
                <input id="pickup-date" name="pickup-date" type="date" required data-rule="date">
                <span class="error-msg" aria-live="polite"></span>
            </div>
            <div class="field">
                <label for="pickup-or-delivery">Pickup or Delivery:</label>
                <select id="pickup-or-delivery" name="pickup-or-delivery" required data-rule="delivery"><option value="pickup">Pickup</option><option value="delivery">Delivery (coming soon)</option></select>
                <span class="error-msg" aria-live="polite"></span>
            </div>
        </div>
        <div class="additional-info">
            <h3>Additional Information</h3>
            <div class="field">
                <label for="message">Additional Details:</label>
                <textarea id="message" name="message" placeholder="Tell us about your design, colours, allergies…" rows="4" required minlength="10" maxlength="500" data-rule="message"></textarea>
                <span class="error-msg" aria-live="polite"></span>
            </div>
        </div>
        <button type="submit" class="submit">Send Enquiry</button>
        <div id="enquiry-response" class="form-response" role="status" aria-live="polite" tabindex="-1" hidden></div>
    </form>
            </div>
<script src="../assets/js/main.js" defer></script>
</body>
</html>
