<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
    <link rel = "stylesheet" href = "../assets/css/enquiriesstyle.css">
    <title>Crumbs & Co | Enquire</title>
</head>
<body>
    <div class = "start-section">
        <div class = "header-image">
    <header>
        <nav>
            <div class="logo-group">
        <img src="../assets/images/Screenshot 2026-08-13 140642.png" alt="Crumb&Co logo" class="logo-image">
        <span class = "bakery-name">Crumb&Co.</span>
    </div>
            <div class = "nav-links">
        <a href = "../index.html" >HOME</a>|
        <a href = "./products.html" >PRODUCTS</a>|
         <a href = "./enquire.html" >ENQUIRIES</a>|
        <a href = "./about.html" >ABOUT US</a>|
        <a href = "./services.html" >SERVICES</a>|
        <a href = "./contact.html" >CONTACT</a>
         </div>
    </nav>
    </header>

    <main> <!--enquire page main -->
      <div class = "header-content">
        <h1>Enquiry Form</h1>
        <p>
            Please fill out the form below to submit your enquiry. We will get back to you as soon as possible.
        </p>
         </div>
    </main>
    </div>
</div>
<br><br>

        <div class = "enquiry-form">
                <form action = "mailto:" method = "post" enctype = "text/plain">
                    <div class = "personal-details">
                    <h3>Personal Details</h3>
                    <label for = "name">Name:</label>
                    <input type = "text" id = "name" placeholder = "Enter your name" required>

                    <br><br>

                    <label for = "email">Email Address:</label>
                    <input type = "email" id = "email" placeholder = "Enter your email" required>
                    <br><br>

                    <label for = "phone">Customer Phone Number:</label>
                    <input type = "text" id = "phone" placeholder = "Enter your phone number" required>
                    <br><br>
                    </div>

                    <div class = "cake-details">
                    <h3>Cake Details</h3>
                    <label for = "cake-type">Cake Type:</label>
                    <select id = "cake-type" name = "cake-type" required>
                        <option value = "birthday">Birthday Cake</option>
                        <option value = "wedding">Wedding Cake</option>
                        <option value = "custom">Custom Cake</option>
                        <option value = "cupcake">Cup Cake</option>
                    </select>
                    <br><br>

                    <label for = "cake-flavour">Cake Flavour:</label>
                    <input type = "text" id = "cake-flavour" placeholder = "Enter the cake flavour" required>
                    <br><br>

                    <label for = "cake-size">Cake Size:</label>
                    <select id = "cake-size" name = "cake-size" required>
                        <option value = "small">Small</option>
                        <option value = "medium">Medium</option>
                        <option value = "large">Large</option>
                    </select>
                    <br><br>

                    <label for = "number-of-cakes">Number of Cakes:</label>
                    <input type = "number" min="0" id = "number-of-cakes" placeholder = "Enter the number of cakes" required>
                    <br><br>

                    <label for = "occasion">Occasion:</label>
                    <select id = "occasion" name = "occasion" required>
                        <option value = "birthday">Birthday</option>
                        <option value = "wedding">Wedding</option>
                        <option value = "anniversary">Anniversary</option>
                        <option value = "baby-shower">Baby Shower</option>
                        <option value = "graduation">Graduation</option>
                        <option value = "other">Other</option>
                    </select>   
                    <br><br>
                    </div>

                    <div class ="pickup-delivery-time">
                    <h3>Timing</h3>
                    <label for = "pickup-date">Pickup/Delivery Date:</label>
                    <input type = "date" id = "pickup-date" required>
                    <br><br>

                    <label for = "pickup-or-delivery">Pickup or Delivery:</label>
                    <select id = "pickup-or-delivery" name = "pickup-or-delivery" required>
                        <option value = "pickup">Pickup</option>
                        <option value = "delivery">Delivery</option>
                    </select>
                    <br><br>
                    </div>

                    <div class = "additional-info">
                    <h3>Additional Information</h3>
                    <label for = "message">Additional Details:</label>
                    <textarea id = "message" name = "message" placeholder = "Enter your message" rows = "4" required></textarea><br><br>
                    </div>

                    <input type = "submit" value = "Submit" class ="submit">
                </form>
            </div>
</body>
</html>
